<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>10 Minutes Till Dawn</title>
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/sudonym-online/cyanide-assets@main/10-minutes-till-dawn/icon.png">
    <style>
      html, body {
        background: #000;
        width: 100%;
        height: 100%;
        overflow: hidden;
        padding: 0;
        margin: 0;
        font-family: 'Monospace', 'Courier New', monospace;
        color: #0ff;
      }

      #loader-ui {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        box-sizing: border-box;
      }

      #loader-title {
        font-size: 28px;
        font-weight: bold;
        color: #0ff;
        margin-bottom: 10px;
        text-shadow: 0 0 10px #0ff;
      }

      #progress-container {
        width: 60%;
        max-width: 600px;
        height: 20px;
        background: #111;
        border: 2px solid #0ff;
        border-radius: 4px;
        overflow: hidden;
        margin-bottom: 20px;
        box-shadow: 0 0 15px #0ff4;
      }

      #bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #0ff, #0cc);
        transition: width 0.1s linear;
        box-shadow: 0 0 10px #0ff;
      }

      #progress-text {
        font-size: 16px;
        color: #0ff;
        margin-bottom: 20px;
        text-shadow: 0 0 5px #0ff;
      }

      #log {
        width: 80%;
        max-width: 800px;
        max-height: 300px;
        overflow-y: auto;
        background: #0a0a0a;
        border: 1px solid #0ff4;
        border-radius: 4px;
        padding: 10px;
        font-size: 12px;
        line-height: 1.5;
        box-shadow: inset 0 0 10px #0ff2;
      }

      #log div {
        margin: 2px 0;
        white-space: pre-wrap;
        word-break: break-all;
      }

      #gameContainer {
        display: none;
        background: transparent !important;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      #gameContainer canvas {
        position: absolute;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <div id="loader-ui">
      <div id="loader-title">10 MINUTES TILL DAWN</div>
      <div id="progress-container">
        <div id="bar"></div>
      </div>
      <div id="progress-text">0%</div>
      <div id="log"></div>
    </div>
    <div id="gameContainer" data-pixelated="true"></div>
    <script src="loader.js"></script>
  </body>
</html>
