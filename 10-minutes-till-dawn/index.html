<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>10 Minutes Till Dawn</title>
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/sudonym-online/cyanide-assets@main/10-minutes-till-dawn/icon.png">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
      html, body {
        background: #000;
        width: 100%;
        height: 100%;
        overflow: hidden;
        padding: 0;
        margin: 0;
      }

      #loader-ui {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #loader-box {
        width: 500px;
        text-align: left;
      }

      #header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }

      #title {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        color: #0ff;
        white-space: nowrap;
      }

      #progress-container {
        flex: 1;
        height: 8px;
        background: #111;
        border: 1px solid #0ff4;
        border-radius: 2px;
        overflow: hidden;
      }

      #bar {
        height: 100%;
        width: 0%;
        background: #0ff;
        transition: width 0.1s linear;
      }

      #progress-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        color: #0ff;
        white-space: nowrap;
      }

      #log {
        height: 250px;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: #0ff4 transparent;
      }

      #log div {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        line-height: 1.6;
        margin: 0;
        white-space: pre-wrap;
        word-break: break-all;
      }

      #gameContainer {
        display: none;
        background: transparent !important;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      #gameContainer canvas {
        position: absolute;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <div id="loader-ui">
      <div id="loader-box">
        <div id="header">
          <span id="title">10 MINUTES TILL DAWN</span>
          <div id="progress-container">
            <div id="bar"></div>
          </div>
          <span id="progress-text">0%</span>
        </div>
        <div id="log"></div>
      </div>
    </div>
    <div id="gameContainer" data-pixelated="true"></div>
    <script src="loader.js"></script>
  </body>
</html>
